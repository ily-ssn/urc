<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11150f" />
    <title>Explore — Powerhouse Urban Run Club</title>
    <meta
      name="description"
      content="Find the next URC run in Harare, explore community galleries and meet the partners supporting a lifestyle in motion."
    />
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/explore.css" />
    <script type="module" src="/explore.js"></script>
  </head>
  <body class="explore-body">
    <header class="explore-header">
      <a class="brand" href="/" aria-label="URC home"
        ><span class="brand-mark">U<i>R</i>C</span
        ><span class="brand-full">POWERHOUSE<br />URBAN RUN CLUB</span></a
      >
      <nav aria-label="Explore URC">
        <a href="/events">Runs</a><a href="/gallery">Gallery</a
        ><a href="/impact">Impact</a><a href="/partners">Partners</a>
      </nav>
      <a class="explore-home" href="/">Home ↗</a>
    </header>
    <main id="explore-main">
      <div class="explore-intro">
        <span class="index" id="explore-eyebrow">URC / HARARE</span>
        <h1 id="explore-title">ALWAYS<br />IN MOTION.</h1>
        <p id="explore-description">
          The runs, people and moments that bring us together.
        </p>
      </div>
      <div id="explore-status" role="status">Loading community updates…</div>
      <section
        id="explore-content"
        class="explore-content"
        aria-label="Community updates"
      ></section>
    </main>
    <footer class="explore-footer">
      <a class="brand-mark" href="/" aria-label="URC home">U<i>R</i>C</a>
      <p>A lifestyle in motion. Harare, Zimbabwe.</p>
      <a href="/studio">Team sign-in ↗</a>
    </footer>
    <dialog id="photo-viewer" aria-label="Gallery photo">
      <button id="photo-close" aria-label="Close photo">✕</button
      ><img id="viewer-image" alt="" />
      <p id="viewer-caption"></p>
      <div class="viewer-controls">
        <button id="photo-previous" aria-label="Previous photo">←</button
        ><span id="photo-count"></span
        ><button id="photo-next" aria-label="Next photo">→</button>
      </div>
    </dialog>
  </body>
</html>
